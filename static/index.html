<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>레시피 챗봇</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
    background: #f4f5f7;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: #fff;
    border-bottom: 1px solid #e5e7eb;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  header h1 { font-size: 17px; color: #111827; }

  #new-chat {
    border: 1px solid #d1d5db;
    background: #fff;
    color: #374151;
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  #new-chat:hover { background: #f3f4f6; }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
  }

  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 15px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .msg.user {
    align-self: flex-end;
    background: #3b82f6;
    color: #fff;
    border-bottom-right-radius: 4px;
  }

  .msg.bot {
    align-self: flex-start;
    background: #fff;
    color: #111827;
    border: 1px solid #e5e7eb;
    border-bottom-left-radius: 4px;
  }

  .msg.error {
    align-self: flex-start;
    background: #fef2f2;
    color: #b91c1c;
    border: 1px solid #fecaca;
  }

  .msg.loading::after {
    content: "";
    animation: dots 1.2s infinite steps(4);
  }
  @keyframes dots {
    0%   { content: ""; }
    25%  { content: "."; }
    50%  { content: ".."; }
    75%  { content: "..."; }
  }

  form {
    background: #fff;
    border-top: 1px solid #e5e7eb;
    padding: 12px 20px;
  }

  .input-row {
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
  }

  #question {
    flex: 1;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    padding: 11px 14px;
    font-size: 15px;
    outline: none;
  }
  #question:focus { border-color: #3b82f6; }

  #send {
    background: #3b82f6;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 0 20px;
    font-size: 15px;
    cursor: pointer;
  }
  #send:disabled { background: #93c5fd; cursor: not-allowed; }
</style>
</head>
<body>

<header>
  <h1>🍳 레시피 챗봇</h1>
  <button id="new-chat" type="button">새 대화</button>
</header>

<div id="messages">
  <div class="msg bot">안녕하세요! 어떤 요리가 궁금하신가요?</div>
</div>

<form id="chat-form">
  <div class="input-row">
    <input id="question" type="text" placeholder="질문을 입력하세요..." autocomplete="off" autofocus>
    <button id="send" type="submit">전송</button>
  </div>
</form>

<script>
  const messagesEl = document.getElementById("messages");
  const formEl = document.getElementById("chat-form");
  const inputEl = document.getElementById("question");
  const sendEl = document.getElementById("send");
  const newChatEl = document.getElementById("new-chat");

  let threadId = null;

  function addMessage(text, cls) {
    const div = document.createElement("div");
    div.className = "msg " + cls;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  formEl.addEventListener("submit", async (e) => {
    e.preventDefault();
    const question = inputEl.value.trim();
    if (!question) return;

    addMessage(question, "user");
    inputEl.value = "";
    sendEl.disabled = true;
    const loadingEl = addMessage("답변 생성 중", "bot loading");

    try {
      const res = await fetch("/query", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, thread_id: threadId }),
      });
      if (!res.ok) throw new Error("서버 오류 (" + res.status + ")");

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let readerDone = false;

      while (!readerDone) {
        const { done, value } = await reader.read();
        readerDone = done;
        buffer += decoder.decode(value || new Uint8Array(), { stream: !done });

        const events = buffer.split("\n\n");
        buffer = events.pop(); // 마지막 불완전한 조각은 다음 루프로

        for (const line of events) {
          if (!line.startsWith("data: ")) continue;
          const payload = JSON.parse(line.slice(6));

          if (payload.type === "progress") {
            loadingEl.textContent = payload.status;
          } else if (payload.type === "final") {
            threadId = payload.thread_id;
            loadingEl.classList.remove("loading");
            loadingEl.textContent = payload.answer;
          } else if (payload.type === "error") {
            throw new Error(payload.message);
          }
        }
      }
    } catch (err) {
      loadingEl.remove();
      addMessage("오류가 발생했습니다: " + err.message, "error");
    } finally {
      sendEl.disabled = false;
      inputEl.focus();
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
  });

  newChatEl.addEventListener("click", () => {
    threadId = null;
    messagesEl.innerHTML = "";
    addMessage("안녕하세요! 어떤 요리가 궁금하신가요?", "bot");
    inputEl.focus();
  });
</script>

</body>
</html>
