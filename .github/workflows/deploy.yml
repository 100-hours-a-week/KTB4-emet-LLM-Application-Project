name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 코드 체크아웃
        uses: actions/checkout@v4

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: 이미지 빌드 및 push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/chatbot-project:latest
          ## GitHub Actions 러너는 매번 새 VM이라 캐시 설정이 없으면 이전 빌드의 레이어를
          ## 전혀 재사용하지 못한다. 특히 BGE-m3 모델(~2.2GB)을 미리 받아두는 레이어가
          ## 소스 코드와 무관하게 매 배포마다 처음부터 다시 다운로드됨 -> GHA 캐시로 재사용
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: EC2에 SSH 접속하여 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            ## docker pull이 실패해도(디스크 부족, 네트워크 등) 스크립트가 계속 진행되면
            ## 옛날 로컬 이미지로 컨테이너를 재생성하고 "성공"으로 끝나버린다.
            ## set -e로 pull 실패 시 즉시 중단 -> 기존(정상 동작 중인) 컨테이너는
            ## 그대로 유지되고 워크플로우가 실패로 표시된다.
            set -e
            docker image prune -f
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/chatbot-project:latest
            docker stop chatbot-container || true
            docker rm chatbot-container || true
            docker run -d \
              --name chatbot-container \
              --restart unless-stopped \
              -p 8000:8000 \
              --env-file /home/ubuntu/.env \
              -v /home/ubuntu/data/vdb:/app/data/vdb \
              ${{ secrets.DOCKERHUB_USERNAME }}/chatbot-project:latest